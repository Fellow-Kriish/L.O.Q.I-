# L.O.Q.I. — Continuous Integration
#
# Two jobs:
#   * gate      — BLOCKING: ruff lint + the intent-router regression. The router
#                 tests import only stdlib (intents.py + tests/corpus.py), so CI
#                 stays fast and installs NO heavy ML deps (torch / kokoro /
#                 faster-whisper). The router precision guarantee is the gate.
#   * typecheck — ADVISORY: mypy over the whole tree. The codebase is being typed
#                 incrementally; this surfaces type debt without blocking merges.
#                 Flip `continue-on-error` off once the legacy modules are typed.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    name: Lint & router regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling + light deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # pydantic(-settings) is the only runtime dep the router path / config
          # import needs. Heavy ML wheels are intentionally omitted.
          pip install pydantic pydantic-settings
      - name: Ruff (lint)
        run: ruff check .
      - name: Router regression (precision gate)
        run: pytest tests/ -m "not audio and not model and not network" -v

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pydantic pydantic-settings
      - name: mypy
        run: mypy .
