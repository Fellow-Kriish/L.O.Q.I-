# L.O.Q.I. — Continuous Integration
#
# Two jobs, both BLOCKING:
#   * gate      — ruff lint + the router and name-resolution regressions. These
#                 tests import only stdlib, pydantic(-settings) and rapidfuzz,
#                 so CI stays fast and installs NO heavy ML deps (torch /
#                 kokoro / faster-whisper). Router precision and the app/process
#                 matching policy are the two guarantees worth gating on: one
#                 decides what the LLM never sees, the other decides what gets
#                 launched and killed without being asked.
#   * typecheck — mypy over the whole tree. Was advisory while the v0.1 modules
#                 carried type debt; the tree is now clean, so this blocks to stop
#                 new debt landing. Ignores that depend on an uninstalled package
#                 or on Windows-only APIs (os.startfile) are written as
#                 `type: ignore[<code>, unused-ignore]` so the result is identical
#                 with or without the ML wheels present.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    name: Lint & router regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling + light deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The only runtime deps the tested paths import. pydantic(-settings)
          # backs config.py (python-dotenv comes with it); rapidfuzz backs
          # app_registry's matcher and has no dependencies of its own. Heavy ML
          # wheels are intentionally omitted.
          pip install pydantic pydantic-settings rapidfuzz
      - name: Ruff (lint)
        run: ruff check .
      - name: Router regression (precision gate)
        run: pytest tests/ -m "not audio and not model and not network" -v

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pydantic pydantic-settings rapidfuzz
      - name: mypy
        run: mypy .
