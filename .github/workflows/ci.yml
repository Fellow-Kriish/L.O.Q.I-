# L.O.Q.I. — Continuous Integration
#
# Two jobs, both BLOCKING:
#   * gate      — ruff lint + the intent-router regression. The router tests
#                 import only stdlib (intents.py + tests/corpus.py), so CI stays
#                 fast and installs NO heavy ML deps (torch / kokoro /
#                 faster-whisper). The router precision guarantee is the gate.
#   * typecheck — mypy over the whole tree. Was advisory while the v0.1 modules
#                 carried type debt; the tree is now clean, so this blocks to stop
#                 new debt landing. Ignores that depend on an uninstalled package
#                 or on Windows-only APIs (os.startfile) are written as
#                 `type: ignore[<code>, unused-ignore]` so the result is identical
#                 with or without the ML wheels present.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    name: Lint & router regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling + light deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # pydantic(-settings) is the only runtime dep the router path / config
          # import needs. Heavy ML wheels are intentionally omitted.
          pip install pydantic pydantic-settings
      - name: Ruff (lint)
        run: ruff check .
      - name: Router regression (precision gate)
        run: pytest tests/ -m "not audio and not model and not network" -v

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pydantic pydantic-settings
      - name: mypy
        run: mypy .
