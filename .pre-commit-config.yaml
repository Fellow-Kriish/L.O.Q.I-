# L.O.Q.I. — pre-commit hooks.
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# Mirrors the CI lint gate so issues are caught before they're pushed.
# (Formatting via `ruff format` is intentionally left out for now to avoid a
#  mass reformat of the v0.1 tree; enable it once the codebase is formatted.)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
